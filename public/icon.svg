<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="50%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background with rounded squircles -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner border ring -->
  <rect x="24" y="24" width="464" height="464" rx="88" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="4" />

  <!-- Main Brand Icon: Megaphone + AI Sparks -->
  <g filter="url(#shadow)">
    <!-- Megaphone Cone -->
    <path d="M160 216 L280 156 L280 356 L160 296 Z" fill="#FFFFFF" />
    
    <!-- Megaphone Back Handle -->
    <rect x="136" y="226" width="32" height="60" rx="8" fill="#F3F4F6" />
    
    <!-- Megaphone Handle bottom -->
    <path d="M184 296 L184 376 Q184 392 200 392 Q216 392 216 376 L216 296 Z" fill="#E5E7EB" />
    
    <!-- Sound Waves / Megaphone Front Arc -->
    <ellipse cx="280" cy="256" rx="20" ry="100" fill="#E5E7EB" />
    <ellipse cx="280" cy="256" rx="10" ry="85" fill="#DC2626" />

    <!-- AI Sparkle 1 (Top Right) -->
    <path d="M356 160 Q384 160 384 132 Q384 160 412 160 Q384 160 384 188 Q384 160 356 160 Z" fill="url(#goldGrad)" />
    
    <!-- AI Sparkle 2 (Center Right) -->
    <path d="M336 256 Q360 256 360 232 Q360 256 384 256 Q360 256 360 280 Q360 256 336 256 Z" fill="#FEF08A" />

    <!-- AI Sparkle 3 (Bottom Right) -->
    <path d="M360 340 Q380 340 380 320 Q380 340 400 340 Q380 340 380 360 Q380 340 360 340 Z" fill="url(#goldGrad)" />
  </g>

  <!-- Korean Text "AI" badge at bottom -->
  <rect x="176" y="416" width="160" height="40" rx="20" fill="url(#goldGrad)" filter="url(#shadow)" />
  <text x="256" y="443" font-family="'Pretendard', sans-serif" font-size="20" font-weight="900" fill="#78350F" text-anchor="middle" letter-spacing="2">AI 홍보실</text>
</svg>
